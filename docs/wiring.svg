<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#09111d" flood-opacity=".18"/></filter>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17202b}
      .subtitle{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#667383}
      .card-title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .card-sub{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#d6dfeb}
      .card-note{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .pin{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17202b}
      .pin-light{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .note{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#526172}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#718092}
      .wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f5f7fa"/>
  <text x="70" y="66" class="title">ESP32-C3 动平衡仪接线图</text>
  <text x="70" y="96" class="subtitle">按当前固件实际使用的 GPIO 定义绘制，AO 与 INT 不接</text>

  <!-- wires -->
  <path d="M 175 155 H 455 V 399 H 513" stroke="#d94b4b" stroke-width="5" class="wire"/>
  <path d="M 175 155 H 45 V 416 H 93" stroke="#d94b4b" stroke-width="5" class="wire"/>
  <path d="M 900 155 H 965 V 416 H 1028" stroke="#d94b4b" stroke-width="5" class="wire"/>
  <path d="M 175 190 H 475 V 439 H 513" stroke="#27313d" stroke-width="5" class="wire"/>
  <path d="M 175 190 H 60 V 456 H 93" stroke="#27313d" stroke-width="5" class="wire"/>
  <path d="M 900 190 H 945 V 265 H 1018 V 285" stroke="#27313d" stroke-width="5" class="wire"/>
  <path d="M 109 504 H 48 V 720 H 470 V 508 H 513" stroke="#3779d0" stroke-width="5" class="wire"/>
  <path d="M 109 544 H 30 V 742 H 490 V 548 H 513" stroke="#38a96d" stroke-width="5" class="wire"/>
  <path d="M 1028 504 H 970 V 468 H 887" stroke="#e8952f" stroke-width="5" class="wire"/>



  <!-- common power rails -->
  <path d="M 175 155 H 900" stroke="#d94b4b" stroke-width="6" class="wire"/>
  <path d="M 175 190 H 900" stroke="#27313d" stroke-width="6" class="wire"/>
  <rect x="92" y="133" width="114" height="34" rx="10" fill="#fff" stroke="#d9e0e8"/>
  <rect x="92" y="177" width="114" height="34" rx="10" fill="#fff" stroke="#d9e0e8"/>
  <text x="149" y="156" text-anchor="middle" class="pin">3V3</text>
  <text x="149" y="200" text-anchor="middle" class="pin">GND</text>
  <text x="230" y="149" class="small">公共电源线</text>
  <text x="230" y="185" class="small">公共地线</text>

  <!-- MPU card -->
  <rect x="65" y="285" width="330" height="370" rx="22" fill="#2b5b86" filter="url(#shadow)"/>
  <text x="230" y="335" text-anchor="middle" class="card-title">MPU6050</text>
  <text x="230" y="362" text-anchor="middle" class="card-sub">GY-521 振动传感器</text>
  <line x1="96" y1="386" x2="364" y2="386" stroke="#86a5c2" opacity=".45"/>
  <g class="pin-light">
    <text x="110" y="430">VCC</text><text x="110" y="470">GND</text><text x="110" y="510">SCL</text><text x="110" y="550">SDA</text><text x="110" y="590">XDA</text><text x="110" y="630">XCL</text><text x="280" y="430">AD0</text><text x="280" y="470">INT</text>
  </g>
  <rect x="93" y="416" width="16" height="16" rx="4" fill="#d94b4b"/><rect x="93" y="456" width="16" height="16" rx="4" fill="#27313d"/>
  <rect x="93" y="496" width="16" height="16" rx="4" fill="#3779d0"/><rect x="93" y="536" width="16" height="16" rx="4" fill="#3779d0"/>
  <rect x="93" y="576" width="16" height="16" rx="4" fill="#aab7c4"/><rect x="93" y="616" width="16" height="16" rx="4" fill="#aab7c4"/>
  <rect x="365" y="416" width="16" height="16" rx="4" fill="#27313d"/><rect x="365" y="456" width="16" height="16" rx="4" fill="#aab7c4"/>
  <text x="230" y="687" text-anchor="middle" class="card-note">AD0 接 GND，地址 0x68</text>
  <text x="230" y="712" text-anchor="middle" class="card-note">INT 不接，XDA/XCL 不接</text>

  <!-- ESP32 card -->
  <rect x="525" y="245" width="350" height="430" rx="24" fill="#263442" filter="url(#shadow)"/>
  <text x="700" y="319" text-anchor="middle" class="card-title">ESP32-C3</text>
  <text x="700" y="348" text-anchor="middle" class="card-sub">RISC-V · 4 MB Flash</text>
  <rect x="590" y="380" width="220" height="126" rx="12" fill="#344657" stroke="#5b7184"/>
  <text x="700" y="430" text-anchor="middle" class="card-title" style="font-size:20px">主控模块</text>
  <text x="700" y="460" text-anchor="middle" class="card-sub">USB-C</text>
  <!-- left pins -->
  <rect x="513" y="399" width="18" height="18" rx="5" fill="#d94b4b"/><text x="548" y="414" class="pin-light">3V3</text>
  <rect x="513" y="439" width="18" height="18" rx="5" fill="#27313d"/><text x="548" y="454" class="pin-light">GND</text>
  <rect x="513" y="499" width="18" height="18" rx="5" fill="#3779d0"/><text x="548" y="514" class="pin-light">GPIO4 · SDA</text>
  <rect x="513" y="539" width="18" height="18" rx="5" fill="#38a96d"/><text x="548" y="554" class="pin-light">GPIO3 · SCL</text>
  <!-- right pins -->
  <rect x="869" y="459" width="18" height="18" rx="5" fill="#e8952f"/><text x="850" y="474" text-anchor="end" class="pin-light">GPIO6 · DO</text>
  <rect x="869" y="399" width="18" height="18" rx="5" fill="#aab7c4"/><text x="850" y="414" text-anchor="end" class="pin-light">GPIO5</text>
  <rect x="869" y="499" width="18" height="18" rx="5" fill="#aab7c4"/><text x="850" y="514" text-anchor="end" class="pin-light">GPIO7</text>
  <rect x="869" y="539" width="18" height="18" rx="5" fill="#aab7c4"/><text x="850" y="554" text-anchor="end" class="pin-light">GPIO8</text>
  <text x="700" y="620" text-anchor="middle" class="card-sub">本图只标出当前固件用到的引脚</text>

  <!-- TCRT card -->
  <rect x="1000" y="285" width="330" height="300" rx="22" fill="#2b6644" filter="url(#shadow)"/>
  <text x="1165" y="335" text-anchor="middle" class="card-title">TCRT5000</text>
  <text x="1165" y="362" text-anchor="middle" class="card-sub">反射式红外传感器</text>
  <line x1="1030" y1="386" x2="1300" y2="386" stroke="#a7d0b1" opacity=".5"/>
  <text x="1048" y="430" class="pin-light">VCC</text><text x="1048" y="470" class="pin-light">GND</text><text x="1048" y="510" class="pin-light">DO</text><text x="1048" y="550" class="pin-light">AO（不接）</text>
  <rect x="1028" y="416" width="16" height="16" rx="4" fill="#d94b4b"/><rect x="1028" y="456" width="16" height="16" rx="4" fill="#27313d"/><rect x="1028" y="496" width="16" height="16" rx="4" fill="#e8952f"/><rect x="1028" y="536" width="16" height="16" rx="4" fill="#aab7c4"/>
  <text x="1165" y="624" text-anchor="middle" class="card-note">每个脉冲用于计算转速与圈数</text>

  <!-- visible connection overlay: short segments terminate at the pin markers -->
  <g id="connection-overlay">
    <path d="M 365 424 H 345 V 450 H 109 V 464" stroke="#27313d" stroke-width="4" class="wire"/>
    <path d="M 1018 285 V 456 H 1036" stroke="#27313d" stroke-width="5" class="wire"/>
    <path d="M 1028 504 H 970 V 468 H 887" stroke="#e8952f" stroke-width="5" class="wire"/>
    <path d="M 109 504 H 65" stroke="#3779d0" stroke-width="5" class="wire"/>
    <path d="M 109 544 H 65" stroke="#38a96d" stroke-width="5" class="wire"/>
  </g>

  <!-- legend -->
  <rect x="70" y="760" width="1260" height="58" rx="14" fill="#fff" stroke="#d9e0e8"/>
  <circle cx="100" cy="789" r="7" fill="#d94b4b"/><text x="115" y="795" class="note">3V3 电源</text>
  <circle cx="260" cy="789" r="7" fill="#27313d"/><text x="275" y="795" class="note">GND 地</text>
  <circle cx="405" cy="789" r="7" fill="#3779d0"/><text x="420" y="795" class="note">SDA</text>
  <circle cx="510" cy="789" r="7" fill="#38a96d"/><text x="525" y="795" class="note">SCL</text>
  <circle cx="620" cy="789" r="7" fill="#e8952f"/><text x="635" y="795" class="note">DO 脉冲</text>
  <text x="790" y="795" class="note">MPU6050：GPIO4=SDA，GPIO3=SCL；TCRT5000：GPIO6=DO</text>
</svg>
